  <div class="bg-gray-800 shadow-md rounded-lg overflow-hidden w-full mb-6">
    
    <button 
      (click)="togglePanel()"
      class="w-full px-6 py-4 text-left font-medium bg-gray-800 hover:bg-gray-700 transition-colors flex justify-between items-center border-b"
    >
      <span class="text-white-800 font-semibold">Filtros</span>
      <svg 
        [class.rotate-180]="panelOpenState()"
        class="w-5 h-5 transform transition-transform text-white-600"
        fill="none" 
        stroke="currentColor" 
        viewBox="0 0 24 24" 
        xmlns="http://www.w3.org/2000/svg"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
      </svg>
    </button>
    
    
    <div *ngIf="panelOpenState()" class="p-6 bg-gray-800">
      <form [formGroup]="filtroForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        
        <div class="space-y-2">
          <label class="block text-sm font-medium text-white-700">Número da Nota</label>
          <input 
            type="text" 
            formControlName="numeroNota"
            placeholder="Digite o número da nota"
            class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          >
        </div>
        
        
        <div class="space-y-2">
          <label class="block text-sm font-medium text-white-700">Data de Emissão</label>
          <input 
            type="text" 
            onfocus="(this.type='date')" 
            onblur="if(!this.value)this.type='text'"
            placeholder="DD/MM/AAAA"
            class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 placeholder-gray-400"
          >
        </div>
        
        
        <div class="space-y-2">
          <label class="block text-sm font-medium text-white-700">Nome do Fornecedor</label>
          <input 
            type="text" 
            formControlName="nomeFornecedor"
            placeholder="Digite o nome do fornecedor"
            class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          >
        </div>
        
        
        <div class="space-y-2">
          <label class="block text-sm font-medium text-white-700">Nome do Cliente</label>
          <input 
            type="text" 
            formControlName="nomeCliente"
            placeholder="Digite o nome do cliente"
            class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          >
        </div>
      </form>
      
      
      <div class="flex justify-end space-x-2 mt-4">
        <button 
          (click)="limparFiltros()"
          type="button"
          class="px-3.5 py-1.5 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors"
        >
          Limpar Filtros
        </button>
        <button 
          (click)="aplicarFiltros()"
          type="button"
          class="px-3.5 py-1.5 border border-transparent rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 flex items-center transition-colors"
        >
          <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
          </svg>
          Filtrar
        </button>
      </div>
    </div>
  </div>
